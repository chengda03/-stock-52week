name: Optimize 52 better conditions 2020
on:
  push:
    paths:
      - 'optimize_52_better_conditions.py'
      - '.github/workflows/optimize-52-better-conditions.yml'
  workflow_dispatch:
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FinanceData/marcap
          ref: master
          path: marcap
          sparse-checkout: |
            data/marcap-2019.parquet
            data/marcap-2020.parquet
            data/marcap-2021.parquet
            data/marcap-2022.parquet
            data/marcap-2023.parquet
            data/marcap-2024.parquet
            data/marcap-2025.parquet
            data/marcap-2026.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow
      - run: python optimize_52_better_conditions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 52-audit-results
          path: |
            52_improved_conditions.csv
            52_full_ex011930_10slots_ledger.csv
            52_full_ex011930_10slots_equity.csv
