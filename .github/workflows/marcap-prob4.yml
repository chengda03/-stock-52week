name: Marcap plus4 probability 2010-2026
on:
  push:
    paths:
      - '.github/workflows/marcap-prob4.yml'
      - 'scripts/marcap_prob4.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: '01 / Install dependencies'
        run: pip install pandas numpy pyarrow
      - name: '02 / Download marcap annual data (2009-2026)'
        run: |
          echo "## +4% 백테스트 진행 상황" >> "$GITHUB_STEP_SUMMARY"
          echo "- [x] 실행 시작" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p marcap/data
          for year in $(seq 2009 2026); do
            echo "::group::Downloading year $year"
            curl -fLsS --retry 3 -o "marcap/data/marcap-$year.parquet" "https://raw.githubusercontent.com/FinanceData/marcap/master/data/marcap-$year.parquet"
            ls -lh "marcap/data/marcap-$year.parquet"
            echo "DATA DOWNLOAD COMPLETE: $year"
            echo "::endgroup::"
          done
          echo "- [x] 2009~2026년 데이터 다운로드 완료" >> "$GITHUB_STEP_SUMMARY"
      - name: "03 / Calculate +4% probability"
        run: |
          set -o pipefail
          echo "STARTING PROBABILITY CALCULATION"
          python -u scripts/marcap_prob4.py 2>&1 | tee prob4.log
          echo "- [x] 확률 계산 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "### 전체 결과" >> "$GITHUB_STEP_SUMMARY"
          cat results/prob4/summary.csv >> "$GITHUB_STEP_SUMMARY"
      - name: "04 / Upload result files and logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marcap-prob4
          path: |
            results/prob4/
            prob4.log
      - name: "05 / Publish results to GitHub repository"
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prob4/summary.csv results/prob4/annual.csv results/prob4/markets.csv results/prob4/gain_bins.csv results/prob4/volume_bins.csv results/prob4/condition_screen.csv
          git commit -m "Publish +4 percent marcap probability results" || exit 0
          git push
